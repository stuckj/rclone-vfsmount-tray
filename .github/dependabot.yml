# Dependabot version updates.
#
# NB this file is only read from the DEFAULT BRANCH — nothing happens until it is on
# `main`, regardless of what a pull request branch contains.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # One PR for the routine churn rather than a dozen. Majors stay separate
      # because they need reading.
      minor-and-patch:
        update-types: [minor, patch]

  # The workflows pin actions to commit SHAs, which is not maintainable by hand —
  # dependabot rewrites the SHA and updates the trailing version comment for us.
  # That is the main reason this ecosystem is enabled at all.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github_actions]
    commit-message:
      prefix: "ci"
    groups:
      # codeql-action/init and codeql-action/analyze are separate dependencies to
      # dependabot but must run the SAME version — mismatched, the job fails with
      # "Loaded a configuration file for version X, but running version Y". Splitting
      # them across two PRs means both fail and neither can merge alone, which is
      # exactly what happened with the v3 -> v4 bump. No update-types filter here:
      # they must stay together for majors especially.
      codeql:
        patterns: ["github/codeql-action*"]
      actions:
        update-types: [minor, patch]
