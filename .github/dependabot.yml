version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR rather than a dozen; majors stay
      # separate because they need reading.
      minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs in the workflows, which means they cannot be
  # updated by hand realistically — dependabot rewrites the SHA and updates the
  # trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
