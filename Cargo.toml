[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/service",
    "crates/tray",
    "crates/gtk",
]

# `crates/gtk` is deliberately excluded from the default set. It is the only crate
# that links system C libraries (GTK4), so a bare `cargo build` / `cargo test` on a
# machine without the GTK development headers would fail for reasons that have
# nothing to do with what is being changed. It is built explicitly with
# `cargo build -p rclone-vfsmount-tray-gtk`, and in CI by the Nix job, which has the
# headers. See the note in .github/workflows/ci.yml.
default-members = [
    "crates/core",
    "crates/service",
    "crates/tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/stuckj/rclone-vfsmount-tray"
authors = ["John Stucklen"]

# Shared dependency versions, referenced from member crates with `.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "net"] }
zbus = "5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
