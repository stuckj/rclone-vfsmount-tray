# rclone-vfsmount-tray configuration
#
# Lives at $XDG_CONFIG_HOME/rclone-vfsmount-tray/config.toml, or
# ~/.config/rclone-vfsmount-tray/config.toml.
#
# This file is meant to be hand-edited — the graphical mount editor is not built yet.
# Restart the service after editing; it does not watch this file yet.
#
# It references rclone remotes by name. It never contains credentials; those stay in
# rclone's own config, which `rclone config` manages.

# Schema version. Leave it alone unless a release note says otherwise; a file claiming a
# newer version than the installed build is refused rather than half-read.
version = 1


[global]
# Use a specific rclone rather than searching $PATH.
# rclone_path = "/usr/local/bin/rclone"

# Override rclone's cache directory. Normally discovered from `rclone config paths`.
# cache_dir = "/var/cache/rclone"

# Unmount everything when the service stops.
#
# Off by default, and worth leaving off. Mounts are deliberately independent of the
# service's lifetime: it crashes, and it gets restarted, and neither should pull your
# filesystems out from under whatever is using them. Unuploaded data is safe
# either way — rclone's cache is on disk and resumes — but a file being written when the
# mount goes is truncated where it stood, and an unmount you did not ask for is
# disruptive regardless.
unmount_on_service_stop = false

[global.poll]
# How often to ask rclone what is happening, in seconds.
active_secs = 1   # while data is moving
idle_secs = 15    # while nothing is

[global.notifications]
uploads_complete = true   # everything queued for a mount has finished — "safe to unplug"
upload_errors = true      # an upload failed or ran out of retries
mount_failures = true     # a mount failed, or died and could not be restarted
cache_full = true         # the cache is out of room, which silently stalls uploads


# One [[mount]] block per mount. Only name, remote and mount_point are required.
[[mount]]
# Used in the tray, on D-Bus and in the systemd unit name, so it is an identifier rather
# than free text: ASCII letters, digits, '-', '_' and '.' only. "." and ".." are reserved.
name = "photos"

# An rclone remote name, without the trailing colon — `backup`, not `backup:`.
# `rclone listremotes` shows what you have.
remote = "backup"

# Optional path within that remote. Omit for its root.
path = "pictures/raw"

# Where it appears in the filesystem. Must be absolute.
mount_point = "/home/you/mnt/photos"

# How much rclone caches locally. This is the setting that matters most:
#
#   off      no cache. Writes stream straight to the remote.
#   minimal  read-write opens, and any file already cached, go through the cache;
#            write-only opens of uncached files still stream.
#   writes   cache writes locally and upload in the background.  <- default
#   full     cache reads as well, so re-reads are local.
#
# `off` has no write-back queue at all. `minimal` has one, but not every write reaches
# it. Only `writes` and `full` put every write through the queue, which is what upload
# progress is derived from — so under `off` and `minimal`, "nothing pending" does not
# mean "nothing in flight".
cache_mode = "writes"

# Cache limits, in rclone's syntax.
#
# These two do NOT default the same way. Omitting cache_max_size means no size limit,
# but omitting cache_max_age does not mean no age limit — rclone defaults
# --vfs-cache-max-age to 1h, so cached files are evicted an hour after last use. On a
# `full` mount that quietly turns re-reads back into downloads. Set it to "off" for no
# age limit.
#
# rclone will not evict data it has not yet uploaded, so a full cache stalls rather
# than loses.
cache_max_size = "10G"
cache_max_age = "24h"

# Mount when the service starts.
auto_mount = true

# read_only = false
# allow_other = false      # needs user_allow_other in /etc/fuse.conf
# uid = 1000
# gid = 1000

# Masks the permissions of everything in the mount: files are 0666 and directories 0777
# with these bits cleared, so "0022" gives 0644 and 0755.
#
# Always octal, whatever rclone would make of it on its own. rclone before 1.68.0 read a
# value with no leading zero as *decimal*, so "22" meant 0026 there and 0022 everywhere
# since; this tool now sends the same octal to both, and says so in the journal when it
# changes what a mask meant. If you tuned one by trying values against an older rclone,
# re-check it — "22" and "0022" were two different masks, and are now one.
#
# 017777777777 is the largest accepted, because rclone 1.68.0 and later refuse anything
# above it and would not start the mount.
# umask = "0022"

# Anything else, passed to rclone verbatim. An escape hatch for flags this tool does not
# model — if you find yourself relying on it, that is worth an issue.
# extra_args = ["--transfers", "8", "--checkers", "16"]


# [[mount]]
# name = "documents"
# remote = "gdrive"
# mount_point = "/home/you/mnt/documents"
# cache_mode = "full"
