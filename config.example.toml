# rclone-vfsmount-tray configuration
#
# Lives at $XDG_CONFIG_HOME/rclone-vfsmount-tray/config.toml, or
# ~/.config/rclone-vfsmount-tray/config.toml.
#
# This file is meant to be hand-edited — the graphical mount editor is not built yet.
# The service reads it when it starts and does not watch it, so restart the service after
# editing. A mount that is already up keeps the options it was started with — restarting
# the service does not remount it — so a change to one reaches it the next time it is
# mounted: unmount it and mount it again. The service logs a warning naming each mount
# that is running with options this file no longer gives it.
#
# It references rclone remotes by name, so it needs no credentials of its own: those stay
# in rclone's own config, which `rclone config` manages. The exception is `extra_args`
# below, which is passed to rclone verbatim — a credential flag put there does end up in
# this file. Check for that before sharing it.

# Schema version. Leave it alone unless a release note says otherwise; a file claiming a
# newer version than the installed build is refused rather than half-read.
version = 1


[global]
# Use a specific rclone rather than searching $PATH.
# rclone_path = "/usr/local/bin/rclone"

# Where rclone keeps its cache, for every mount. Passed as `--cache-dir`, so it must be
# absolute. Without it rclone uses its own default, which `rclone config paths` shows.
# cache_dir = "/var/cache/rclone"

# Unmount this service's mounts when the service is stopped.
#
# Off by default, and worth leaving off. Mounts are deliberately independent of the
# service's lifetime: it crashes, and it gets restarted, and neither should pull your
# filesystems out from under whatever is using them. Unuploaded data is safe
# either way — rclone's cache is on disk and resumes — but an unmount you did not ask for
# is disruptive regardless.
#
# Turned on, it applies only to an explicit stop: `systemctl --user stop`, or the tray's
# "Stop service". A restart — by hand, or by an upgrade — and a crash still leave every
# mount up, and so does anything the service cannot confirm with systemd was a stop,
# including Ctrl-C when it is run from a terminal. Queued uploads get a chance to finish
# first. The unmount is never forced: a mount something is still using stays up, and the
# journal says so. Mounts this service did not start are never touched.
#
# A logout that stops your user services (it does not when lingering is on — see the
# README) takes every mount down whatever this says. With it on, the service goes first and
# unmounts in the same careful way, but gives itself only 3 seconds, because some
# distributions — Ubuntu among them — kill everything left in the session 5 seconds into a
# logout. Uploads still queued then stay in the cache and resume next time, and whatever
# the service had to leave is stopped by systemd, as with it off. Asking systemd why it is
# stopping needs the session bus, so the service's own unit should be ordered after the
# bus (`After=dbus.service`), or the bus may be gone before it asks.
unmount_on_service_stop = false

[global.poll]
# How often to ask rclone what is happening, in seconds. This is the wait between polls,
# so it has to be at least 1 — and at most 86400, a day — or the service refuses to start
# and says which field is wrong.
active_secs = 1   # while data is moving
idle_secs = 15    # while nothing is

[global.notifications]
# Not acted on yet (#28): there are no desktop notifications, so these do nothing today.
uploads_complete = true   # everything queued for a mount has finished — "safe to unplug"
upload_errors = true      # an upload failed or ran out of retries
mount_failures = true     # a mount failed, or died and could not be restarted
cache_full = true         # the cache is out of room, which silently stalls uploads


# One [[mount]] block per mount. Only name, remote and mount_point are required.
[[mount]]
# Used in the tray, on D-Bus and in the systemd unit name, so it is an identifier rather
# than free text: ASCII letters, digits, '-', '_' and '.' only. "." and ".." are reserved.
name = "photos"

# An rclone remote name, without the trailing colon — `backup`, not `backup:`.
# `rclone listremotes` shows what you have.
remote = "backup"

# Optional path within that remote. Omit for its root.
path = "pictures/raw"

# Where it appears in the filesystem. Must be absolute.
mount_point = "/home/you/mnt/photos"

# How much rclone caches locally. This is the setting that matters most:
#
#   off      no cache. Writes stream straight to the remote.
#   minimal  read-write opens, and any file already cached, go through the cache;
#            write-only opens of uncached files still stream.
#   writes   cache writes locally and upload in the background.  <- default
#   full     cache reads as well, so re-reads are local.
#
# `off` has no write-back queue at all. `minimal` has one, but not every write reaches
# it. Only `writes` and `full` put every write through the queue, which is what upload
# progress is derived from — so under `off` and `minimal`, "nothing pending" does not
# mean "nothing in flight".
cache_mode = "writes"

# Cache limits, in rclone's syntax.
#
# These two do NOT default the same way. Omitting cache_max_size means no size limit,
# but omitting cache_max_age does not mean no age limit — rclone defaults
# --vfs-cache-max-age to 1h, so cached files are evicted an hour after last use. On a
# `full` mount that quietly turns re-reads back into downloads. Set it to "off" for no
# age limit.
#
# rclone will not evict data it has not yet uploaded, so a full cache stalls rather
# than loses.
#
# Both are checked when this file is read, because rclone would otherwise reject them
# at flag-parse time and the mount would simply never start. Sizes take `B`, or `K`,
# `M`, `G`, `T`, `P` or `E` with an optional `i` or `iB` — "10G", "10Gi" and "10GiB"
# are one size, and "10GB" is not one. Ages take a number and a unit from `ns` to `y`,
# as in "24h"; "24H" is not a duration.
cache_max_size = "10G"
cache_max_age = "24h"

# Mount when the service starts. On by default. A mount that is already up is left as it
# is. One that fails to come up — a remote that is unreachable at login, say — is tried
# again, at growing intervals up to every 15 minutes, until it comes up or you mount or
# unmount it yourself. A problem retrying cannot fix — a mount point that cannot be
# created, or something else already mounted there — is reported once and left. It applies
# each time the service starts, so a mount you unmounted comes back after a restart; set
# this to false to keep one down.
auto_mount = true

# read_only = false
# allow_other = false      # needs user_allow_other in /etc/fuse.conf
# uid = 1000
# gid = 1000

# Masks permissions inside the mount: files are 0666 and directories 0777 with these bits
# cleared, so "0022" gives 0644 and 0755. Reported rather than enforced — allow_other is
# what decides who can reach a mount.
#
# Write it octal, with the leading zero. rclone before 1.68.0 read "22" as decimal, so a
# value tuned against one of those means something else now; the journal says so as the
# mount starts, and names the mask to write if you want the old modes back.
# umask = "0022"

# Anything else, passed to rclone verbatim. An escape hatch for flags this tool does not
# model — if you find yourself relying on it, that is worth an issue.
# extra_args = ["--transfers", "8", "--checkers", "16"]


# [[mount]]
# name = "documents"
# remote = "gdrive"
# mount_point = "/home/you/mnt/documents"
# cache_mode = "full"
