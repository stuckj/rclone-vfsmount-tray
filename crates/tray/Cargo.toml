[package]
name = "rclone-vfsmount-tray"
description = "System tray client for rclone-vfsmount-tray — talks to the service over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rclone-vfsmount-tray"
path = "src/main.rs"

# Pure Rust — ksni 0.3 speaks StatusNotifierItem over zbus, so this links no system
# C libraries and stays cheap. It runs all day in a panel; keep it that way.
#
# `anyhow` is not referenced yet: it is declared ahead of the code that will want it, and it
# is what the tier-1 CI job compiles, so if it ever starts pulling in a system C library CI
# breaks on a bare runner and we find out immediately. Do not prune it as "unused"; that
# disarms the tripwire.
[dependencies]
rvt-core = { path = "../core" }
ksni = "0.3"
futures-util = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Declared before a test here needs it, like the dependencies above. `no_stray_scratch`
# already scans this crate, so the first test written in it is told to use `Scratch`; it
# should find `Scratch` rather than an unresolved import.
[dev-dependencies]
rvt-testutil = { path = "../testutil" }
# `test-util` for tokio's paused clock: the tray gives a mount call five minutes before it
# gives up on it, and a test of that should not take five minutes. Dev-only — the binary is
# built without it.
tokio = { workspace = true, features = ["test-util"] }
# Generate this binary's man page and completions in-test, to check the committed copies
# under `docs/` and `completions/` still match what the current `clap` command produces.
clap_mangen = { workspace = true }
clap_complete = { workspace = true }
