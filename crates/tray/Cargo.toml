[package]
name = "rclone-vfsmount-tray"
description = "System tray client for rclone-vfsmount-tray — talks to the service over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rclone-vfsmount-tray"
path = "src/main.rs"

# Pure Rust — ksni 0.3 speaks StatusNotifierItem over zbus, so this links no system
# C libraries and stays cheap. It runs all day in a panel; keep it that way.
[dependencies]
rvt-core = { path = "../core" }
ksni = "0.3"
tokio = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
