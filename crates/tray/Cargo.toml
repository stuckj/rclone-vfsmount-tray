[package]
name = "rclone-vfsmount-tray"
description = "System tray client for rclone-vfsmount-tray — talks to the service over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rclone-vfsmount-tray"
path = "src/main.rs"

# Pure Rust — ksni 0.3 speaks StatusNotifierItem over zbus, so this links no system
# C libraries and stays cheap. It runs all day in a panel; keep it that way.
#
# The CLI client uses most of these. `ksni` and `anyhow` are not referenced yet: they are
# declared ahead of the tray GUI that fills this crate in (#25, #26), deliberately, not by
# accident. They are what the tier-1 CI job compiles, so if either ever starts pulling in a
# system C library — `ksni` speaks StatusNotifierItem and is the one to watch — CI breaks on
# a bare runner and we find out immediately. Do not prune them as "unused"; that disarms the
# tripwire.
[dependencies]
rvt-core = { path = "../core" }
ksni = "0.3"
tokio = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Declared before a test here needs it, like the dependencies above. `no_stray_scratch`
# already scans this crate, so the first test written in it is told to use `Scratch`; it
# should find `Scratch` rather than an unresolved import.
[dev-dependencies]
rvt-testutil = { path = "../testutil" }
